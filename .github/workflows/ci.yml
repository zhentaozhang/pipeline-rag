name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Create .env for tests
        run: |
          cat > .env << 'EOF'
          APP_SECRET_KEY=ci-secret-key-thats-at-least-32-chars!!
          LLM_API_KEY=sk-ci-placeholder
          LLM_BASE_URL=https://api.openai.com/v1
          TAVILY_API_KEY=tvly-ci-placeholder
          JWT_SECRET_KEY=ci-jwt-secret-key-at-least-32-chars-long
          JWT_ADMIN_PASSWORD=ci-admin-password
          EOF

      - name: Run unit tests
        run: |
          uv run pytest tests/ -v \
            --ignore=tests/test_api_chat.py \
            --ignore=tests/test_store.py \
            --ignore=tests/test_document_pipeline.py \
            --ignore=tests/integration \
            --cov=app \
            --cov-report=term \
            --cov-fail-under=40
