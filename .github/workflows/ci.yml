name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 静态检查 + 单元测试 + 编排语法 + 镜像构建冒烟 ─────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      # 格式门禁：防止代码风格再次偏离
      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app

      # 提供占位 LLM_API_KEY：部分模块在导入/实例化时即构造 OpenAI 客户端
      - name: Unit tests
        env:
          LLM_API_KEY: ci-dummy-key
        run: uv run pytest tests/unit -q

      - name: Validate all docker compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.frontend.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.override.yml config >/dev/null

      # 镜像构建冒烟验证：确保 Dockerfile 指令、apt 源、COPY 路径在 CI 中可重放
      - name: Build Docker images (smoke check)
        run: |
          docker compose build app
          docker compose -f docker-compose.frontend.yml build
          docker build -t pipeline-rag-jev:ci ./jev_service

  # ── 前端：lint + 单元测试（vitest + jsdom）──────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

  # ── 全新库迁移冒烟：upgrade → downgrade → upgrade，并断言与 ORM 一致 ──────
  migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: pipeline_rag
          MYSQL_USER: pipeline_rag
          MYSQL_PASSWORD: ci-app-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --protocol=tcp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DB: pipeline_rag
      MYSQL_USER: pipeline_rag
      MYSQL_PASSWORD: ci-app-pass

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Fresh upgrade on empty DB
        run: uv run alembic upgrade head

      - name: Downgrade to base
        run: uv run alembic downgrade base

      - name: Upgrade again
        run: uv run alembic upgrade head

      - name: Assert schema matches ORM (autogenerate must be empty)
        run: |
          uv run alembic revision --autogenerate -m ci_check --rev-id cicheck
          file=$(ls alembic/versions/cicheck*.py)
          if grep -qE "op\.(create_table|drop_table|add_column|drop_column|create_index|drop_index|alter_column|create_foreign_key)" "$file"; then
            echo "::error::ORM 与迁移结果不一致，autogenerate 产生非空变更"
            cat "$file"
            exit 1
          fi

  # ── 真实环境集成测试：覆盖 Redis 租约锁 / 记忆管理 / SSE 链路等 ────────────
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: pipeline_rag
          MYSQL_USER: pipeline_rag
          MYSQL_PASSWORD: ci-app-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --protocol=tcp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pipeline_rag_vector
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-pg-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DB: pipeline_rag
      MYSQL_USER: pipeline_rag
      MYSQL_PASSWORD: ci-app-pass
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pipeline_rag_vector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-pg-pass
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      LLM_API_KEY: ci-dummy-key

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Prepare database schema
        run: uv run alembic upgrade head

      - name: Run integration tests
        run: uv run pytest tests/integration -q
