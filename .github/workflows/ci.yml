name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # 夜间兜底：即使整天不推代码，也在锁定依赖/基础镜像漂移 24h 内暴露。
  # 2026-10-23 的事故放大器是 59 个 commit 攒着一次推，中间 6 天无人拦截。
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 静态检查 + 单元测试 + 编排语法 + 镜像构建冒烟 ─────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # 锁解析器自身也要可复现：与本地 uv --version 对齐，"latest" 会让
          # 某个早上 uv 静默升级就改变 CI 行为，而仓库里没有任何 diff。
          version: "0.10.0"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app

      # 提供占位 LLM_API_KEY：部分模块在导入/实例化时即构造 OpenAI 客户端
      - name: Unit tests
        env:
          LLM_API_KEY: ci-dummy-key
        run: uv run pytest tests/unit -q

      # 格式门禁放在实质检查之后：纯风格失败不再让 mypy/单测被静默跳过
      # （2026-10-23 的事故就是格式失败把 5 个 mypy 错误掩盖了 6 天）
      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Validate all docker compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.frontend.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.override.yml config >/dev/null

      # 镜像构建冒烟验证：确保 Dockerfile 指令、apt 源、COPY 路径在 CI 中可重放
      - name: Build Docker images (smoke check)
        run: |
          docker compose build app
          docker compose -f docker-compose.frontend.yml build
          docker build -t pipeline-rag-jev:ci ./jev_service

  # ── 前端：lint + 单元测试（vitest + jsdom）──────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

  # ── 全新库迁移冒烟：upgrade → downgrade → upgrade，并断言与 ORM 一致 ──────
  migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: pipeline_rag
          MYSQL_USER: pipeline_rag
          MYSQL_PASSWORD: ci-app-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --protocol=tcp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DB: pipeline_rag
      MYSQL_USER: pipeline_rag
      MYSQL_PASSWORD: ci-app-pass

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # 锁解析器自身也要可复现：与本地 uv --version 对齐，"latest" 会让
          # 某个早上 uv 静默升级就改变 CI 行为，而仓库里没有任何 diff。
          version: "0.10.0"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Fresh upgrade on empty DB
        run: uv run alembic upgrade head

      - name: Downgrade to base
        run: uv run alembic downgrade base

      - name: Upgrade again
        run: uv run alembic upgrade head

      - name: Assert schema matches ORM (autogenerate must be empty)
        run: |
          uv run alembic revision --autogenerate -m ci_check --rev-id cicheck
          file=$(ls alembic/versions/cicheck*.py)
          if grep -qE "op\.(create_table|drop_table|add_column|drop_column|create_index|drop_index|alter_column|create_foreign_key)" "$file"; then
            echo "::error::ORM 与迁移结果不一致，autogenerate 产生非空变更"
            cat "$file"
            exit 1
          fi

  # ── 真实环境集成测试：覆盖 Redis 租约锁 / 记忆管理 / SSE 链路等 ────────────
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: pipeline_rag
          MYSQL_USER: pipeline_rag
          MYSQL_PASSWORD: ci-app-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --protocol=tcp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pipeline_rag_vector
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-pg-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DB: pipeline_rag
      MYSQL_USER: pipeline_rag
      MYSQL_PASSWORD: ci-app-pass
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pipeline_rag_vector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-pg-pass
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      LLM_API_KEY: ci-dummy-key

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # 锁解析器自身也要可复现：与本地 uv --version 对齐，"latest" 会让
          # 某个早上 uv 静默升级就改变 CI 行为，而仓库里没有任何 diff。
          version: "0.10.0"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Prepare database schema
        run: uv run alembic upgrade head

      - name: Run integration tests
        run: uv run pytest tests/integration -q

  # ── JEV 决策 A/B 门禁：夜间真跑，不再"跳过即绿" ──────────────────────────
  # 历史问题：条件挂在仓库变量 JEV_BASE_URL 上，而该变量从未配置 → job 永远
  # skipped，界面全绿但零覆盖。现在的规则：
  #   · schedule / workflow_dispatch：在本 runner 内用 compose 起 jev-service
  #     （含 ~3GB 模型下载，所以只挂夜间，不进每次 push 的关键路径）；
  #   · 配置了 vars.JEV_BASE_URL（自托管/外部服务）时直接复用，不起容器。
  decision-ab:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || vars.JEV_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_API_KEY: ci-dummy-key
      # 没有外部服务时，指向本 job 用 compose 起的容器（compose 把 8085 映射到 8080）
      JEV_BASE_URL: ${{ vars.JEV_BASE_URL || 'http://localhost:8085' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # 锁解析器自身也要可复现：与本地 uv --version 对齐，"latest" 会让
          # 某个早上 uv 静默升级就改变 CI 行为，而仓库里没有任何 diff。
          version: "0.10.0"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # 只有"没有外部 JEV 服务"时才本地拉起；/health 在模型就绪前返回 503
      # （jev_service/server.py:81-92），所以必须轮询到 200 再跑门禁。
      - name: Start local JEV service
        if: ${{ vars.JEV_BASE_URL == '' }}
        run: |
          # 用 --env-file 而不是 cp .env：runner 上不留一个含默认口令的 .env
          docker compose --env-file .env.example up -d --build jev-service
          for i in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8085/health || true)
            if [ "$code" = "200" ]; then
              echo "JEV service ready after $((i * 10))s"
              exit 0
            fi
            echo "waiting for JEV service ($((i * 10))s elapsed, last status=$code)"
            sleep 10
          done
          echo "::error::JEV service 未在 25 分钟内就绪"
          docker compose --env-file .env.example logs --tail=200 jev-service
          exit 1

      - name: Decision A/B gate (JEV)
        run: |
          uv run python -m scripts.evaluation.decision_ab --all --backends jev \
            --min-recall 0.8 --min-precision 0.85 --min-f1 0.8 \
            --min-accuracy 0.75 --min-macro-f1 0.75 --require-jev

      - name: Dump JEV logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --tail=200 jev-service || true

