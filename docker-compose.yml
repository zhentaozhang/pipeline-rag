# 统一日志轮转，防止长期运行撑满宿主磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 业务镜像统一构建参数（app / migrate / celery-worker / celery-beat 共用）
# 国内网络可覆盖：UV_DEFAULT_INDEX / APT_MIRROR；
# 若需经宿主代理构建：BUILD_HTTP_PROXY=http://host.docker.internal:<port>
x-app-build: &app-build
  context: .
  args:
    UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
    APT_MIRROR: ${APT_MIRROR:-}
    HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
    HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
    http_proxy: ${BUILD_HTTP_PROXY:-}
    https_proxy: ${BUILD_HTTPS_PROXY:-}
    NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1}

services:
  # ── MySQL 8.4（业务数据库 + LangGraph Checkpointer）──────────────────────
  # 注意：禁止使用 MySQL 9.x，checkpoint-mysql 依赖 MD5 函数在 9.6+ 被废弃
  mysql:
    image: mysql:8.4
    container_name: pipeline-rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-pipeline-rag123}
      MYSQL_DATABASE: ${MYSQL_DB:-pipeline_rag}
      # 应用用户（须非 root；MySQL 镜像不接受 MYSQL_USER=root）
      MYSQL_USER: ${MYSQL_USER:-pipeline_rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pipeline-rag123}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  # ── PostgreSQL 16 + PGVector（向量检索）──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pipeline-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_rag_vector}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline-rag123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Elasticsearch 8.13（关键词检索 + IK 分词预烘焙）─────────────────────
  elasticsearch:
    build:
      context: ./docker
      dockerfile: Dockerfile.elasticsearch
      args:
        IK_PLUGIN_URL: ${ES_IK_PLUGIN_URL:-https://get.infini.cloud/elasticsearch/analysis-ik/8.13.4}
        HTTP_PROXY: ${ES_HTTP_PROXY:-}
        HTTPS_PROXY: ${ES_HTTP_PROXY:-}
    image: pipeline-rag-elasticsearch:8.13.4
    container_name: pipeline-rag-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx1g}
      - "cluster.name=pipeline-rag-es"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Neo4j 5.20（文档结构图谱）───────────────────────────────────────────
  neo4j:
    image: neo4j:5.20
    container_name: pipeline-rag-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-pipeline-rag123}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Redis 7.2（缓存 + 分布式锁 + Celery Broker）─────────────────────────
  redis:
    image: redis:7.2
    container_name: pipeline-rag-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G

  # ── MinIO（对象存储）───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: pipeline-rag-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── DB 迁移（一次性；app/worker 等它成功后再启动）────────────────────────
  migrate:
    image: pipeline-rag-app:latest
    build: *app-build
    container_name: pipeline-rag-migrate
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      MYSQL_HOST: mysql
    command: >
      bash -c 'for i in 1 2 3 4 5; do
        alembic upgrade head && exit 0;
        echo "migrate attempt $$i failed, retry in 5s"; sleep 5;
      done; exit 1'
    healthcheck:
      disable: true
    logging: *default-logging

  # ── FastAPI App（Python）─────────────────────────────────────────────────
  app:
    # 已完成多 Worker 并发改造：DB 短事务解耦 + Redis 租约锁 + Redis Pub/Sub 广播取消，安全支持 4 Worker 并行
    build: *app-build
    image: pipeline-rag-app:latest
    container_name: pipeline-rag
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 4 --timeout-graceful-shutdown 60
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      MYSQL_HOST: mysql
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ES_HOST: elasticsearch
      MINIO_ENDPOINT: minio:9000
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      # Celery broker/backend 默认为 localhost，容器内必须显式指向 redis 服务名
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # JEV System 1 决策服务容器内网络解析
      JEV_BASE_URL: http://jev-service:8080
    ports:
      - "${APP_PORT:-8080}:8080"
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  # ── Celery Worker（异步任务）────────────────────────────────────────────
  celery-worker:
    image: pipeline-rag-app:latest
    build: *app-build
    container_name: pipeline-rag-celery
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ES_HOST: elasticsearch
      MINIO_ENDPOINT: minio:9000
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JEV_BASE_URL: http://jev-service:8080
    command: celery -A app.celery_app worker -l info -c 4 --without-gossip --without-mingle
    healthcheck:
      disable: true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  # ── Celery Beat（定时调度：文档孤儿清理等）─────────────────────────────
  celery-beat:
    image: pipeline-rag-app:latest
    build: *app-build
    container_name: pipeline-rag-celery-beat
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ES_HOST: elasticsearch
      MINIO_ENDPOINT: minio:9000
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A app.celery_app beat -l info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    logging: *default-logging

  # ── JEV 本地判断模型服务（System 1 决策层）─────────────────────────────
  jev-service:
    build:
      context: ./jev_service
    container_name: pipeline-rag-jev
    restart: unless-stopped
    environment:
      JEV_MODEL: ${JEV_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      JEV_DEVICE: ${JEV_DEVICE:-cpu}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - jev_model_cache:/data/cache
    ports:
      - "${JEV_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

volumes:
  mysql_data:
  postgres_data:
  es_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  minio_data:
  jev_model_cache:
