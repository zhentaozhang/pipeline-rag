[project]
name = "pipeline-rag"
version = "0.1.0"
description = "pipeline-rag - 企业级 AI Agent 智能体平台"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # 类型安全 & 配置
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
    # LangGraph Agent & Orchestrator
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # LLM & HTTP
    "openai>=1.30.0",
    "httpx>=0.27.0",
    # 模板引擎
    "jinja2>=3.1.0",
    # 基础设施
    "redis>=5.0.4",
    "celery>=5.4.0",
    "minio>=7.2.0",
    "neo4j>=5.20.0",
    "elasticsearch>=8.13.0,<9.0.0",
    # MCP 协议
    # 下限 2.11.3：2.9.x 的 Settings 类与 pydantic>=2.13 不兼容
    # （pydantic 报 "cannot specify both default and default_factory"），
    # 会导致 app.mcp.server 无法导入、MCP 服务无法启动。
    # 上限 <3：本模块使用的 FastMCP() / @mcp.tool() / mcp.run(transport=)
    # 在 2.x 线已验证；升级到 3.x/4.x 需单独评估 API 变更。
    "fastmcp>=2.11.3,<3",
    # 文档解析
    "markitdown>=0.1.0",
    # 认证
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    # 安全：Presidio PII 检测依赖 spaCy 英文模型（app/safety/presidio_pii.py 中
    # 显式指定 en_core_web_sm）。spaCy 模型不走 PyPI 常规包名，必须显式声明，
    # 否则全新 `uv sync` 出来的环境缺少模型 → PII 检测静默降级为不生效。
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # 可观测性
    # 自研 Trace（app/observability）为唯一生产标准；如需接入 OTLP Collector，
    # 按需安装 opentelemetry-sdk + otlp exporter 后自建初始化模块。
    # 工具
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
    "prometheus-client>=0.21.0",
    "python-multipart>=0.0.9",
    "jieba>=0.42.1",
    "langchain-openai>=1.2.2",
    # RAG 质量评估（自实现，不依赖 ragas 库以避免 vertexai 冲突）
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "trafilatura>=2.2.0",
    "lark-oapi>=1.0.0",
    "celery-types>=0.26.0",
    "langfuse>=4.15.2",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[project.optional-dependencies]
# 完整文档解析（unstructured 为可选：镜像减重；缺失时 PDF/Word/PPT 自动降级 markitdown，
# 复杂版式可启用 MinerU 增强通道 CONNECTOR/MINERU_ENABLED）
full-parsing = [
    "unstructured[pdf]>=0.15.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",   # TestClient
    "pre-commit>=3.8.0",
    "tiktoken>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# en-core-web-sm 以 GitHub release 直链声明（spaCy 模型不在 PyPI 常规索引），
# hatchling 默认拒绝 project.dependencies 中的直接引用，需显式放行。
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
ignore = ["E501", "B008"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.db.models" = {"msg" = "ORM model 禁止在 API 层直接使用，请通过 service/schema 访问"}

[tool.ruff.lint.per-file-ignores]
"app/document/tasks/**" = ["E402"]
"app/infra/id_generator.py" = ["E402", "SIM105"]
"app/infra/route_indexer.py" = ["E402"]
"app/infra/pg.py" = ["SIM105"]
"app/observability/trace_recorder.py" = ["E402"]
"app/orchestrator/knowledge_router.py" = ["E402"]
"app/orchestrator/navigation_analyzer.py" = ["SIM102", "F401"]
"app/orchestrator/orchestrator.py" = ["SIM102"]
"app/orchestrator/route_service.py" = ["E741"]
"app/orchestrator/query_rewriter.py" = ["E741"]
"app/orchestrator/recommendation.py" = ["F821"]
"app/agent/graph.py" = ["F821"]
"app/chat/service.py" = ["F821", "B904"]
"app/chat/view_models.py" = ["F821"]
"app/document/chunker/__init__.py" = ["F401"]
"app/document/structure/models.py" = ["E402"]
"app/document/structure/validator.py" = ["E402"]
"app/main.py" = ["TID251"]
"scripts/reindex_all_docs.py" = ["TID251"]
"scripts/evaluation/runner.py" = ["TID251"]
"scripts/evaluation/judge_audit.py" = ["TID251"]
"scripts/evaluation/generate_questions.py" = ["TID251"]
"app/api/admin_auth.py" = ["B904"]
"app/api/chat_session.py" = ["TID251"]
"app/api/chat_session_exchange.py" = ["TID251"]
"app/api/chat_session_gap.py" = ["TID251"]
"app/api/manage.py" = ["E402"]
"app/document/**" = ["TID251"]
"app/manage/**" = ["TID251"]
"app/db/**" = ["TID251"]
"app/chat/**" = ["TID251"]
"app/orchestrator/**" = ["TID251"]
"app/rag/**" = ["TID251"]
"app/agent/**" = ["TID251"]
"app/infra/**" = ["TID251"]
"app/common/**" = ["TID251"]
"app/observability/**" = ["TID251"]
"app/executors/**" = ["TID251"]
"app/mcp/**" = ["TID251"]
"app/safety/**" = ["TID251"]
"alembic/**" = ["TID251"]
"tests/**" = ["TID251"]
"alembic/env.py" = ["E402"]
"app/common/pagination.py" = ["UP006", "UP035"]

[tool.mypy]
python_version = "3.11"
# pydantic 插件：让 mypy 正确理解 BaseModel 的字段名 / 别名 / 默认值。
# 不启用时，凡以 camelCase 别名序列化、以 snake_case 构造的模型
# （GraphSection / GraphItem / GraphQueryResult 等）都会被误报
# "Unexpected keyword argument"（约 30 处噪音，掩盖真实错误）。
plugins = ["pydantic.mypy"]
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
disable_error_code = ["prop-decorator"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
# 会话级事件循环：app/infra/pg.py 等模块持有 asyncpg/redis 全局连接池，
# 若每个测试用独立循环，池会绑定到已关闭的旧循环（Event loop is closed）。
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: marks test as requiring Docker services",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/document/*",
    "app/manage/*",
    "app/mcp/*",
    "tests/*",
    "alembic/*",
    "seed_eval.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "except ImportError:",
    "raise NotImplementedError",
]
