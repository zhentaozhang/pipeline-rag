# Alembic 配置文件
# 使用 app/config.py 中的 MySQL DSN，不在此硬编码

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os

# 数据库 URL 由 env.py 动态读取，此处为占位符
sqlalchemy.url = mysql+pymysql://root:password@localhost/pipeline_rag

[post_write_hooks]
# 自动格式化迁移脚本
hooks = ruff
ruff.type = exec
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
