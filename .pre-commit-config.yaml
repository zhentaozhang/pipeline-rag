repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy typecheck
        entry: uv run mypy app/
        language: system
        pass_filenames: false
        always_run: true

      # 这些用例已迁到 tests/unit/app/**；旧的 tests/test_*.py 早已不存在，
      # 原 entry 会让每次 pre-push 以 exit 4 直接失败。
      - id: pytest-quick
        name: pytest quick (safety + circuit breaker)
        entry: uv run pytest tests/unit/app/safety tests/unit/app/infra/test_circuit_breaker.py -x --no-header -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
